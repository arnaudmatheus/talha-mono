# Build every family, check it against the previous fonts, keep the result.
#
# - build: five shards in parallel, two fonts each (and their NF), so the
#   whole set builds in about the time of one shard.
# - check: gathers the fonts and runs tools/check.py, which fails if any
#   confusable pair got more than 0.01 worse than the fonts committed before
#   this change (the rule every release so far has followed by hand). The
#   fonts and the report are kept as the run's artifact.
# - qa: fontbakery's universal profile on every family (OpenType conformance,
#   names, metrics, Unicode), in parallel with check.
# - test: black --check, mypy and pytest on the build code (CLAUDE.md), in
#   parallel with the builds.
# - release: a tag v<version> publishes a GitHub Release with the fonts
#   zipped, once test, check and qa pass and the tag matches VERSION in
#   tools/merge.py.
name: Build and check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used to publish a Release on a v* tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NF_VERSION: v3.5.1       # Nerd Fonts release the NF icons come from (pinned)
  NF_SHA256: 7cdb44b7cd3855a231641b3cc4cf38f434d615d12e1c475eb86232868c667dc0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Formatting
        run: black --check tools tests

      - name: Types
        run: mypy

      - name: Tests
        run: pytest

      - name: Reading review model
        run: |
          node --check tools/reading_ui/review.mjs
          node tests/test_reading_review.mjs

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: regular,      families: normal, styles: Regular Italic }
          - { name: bold,         families: normal, styles: Bold BoldItalic }
          - { name: wide-regular, families: wide,   styles: Regular Italic }
          - { name: wide-bold,    families: wide,   styles: Bold BoldItalic }
          - { name: text,         families: text,   styles: Regular Italic }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Nerd Fonts icons (pinned and checksummed)
        run: |
          mkdir -p "$RUNNER_TEMP/nf" && cd "$RUNNER_TEMP/nf"
          curl -fsSL -o Monaspace.tar.xz \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/$NF_VERSION/Monaspace.tar.xz"
          echo "$NF_SHA256  Monaspace.tar.xz" | sha256sum -c -
          tar -xJf Monaspace.tar.xz MonaspiceRnNerdFontMono-{Regular,Bold,Italic,BoldItalic}.otf
          echo "NF_DIR=$RUNNER_TEMP/nf" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.families }} ${{ matrix.styles }}
        env:
          FAMILIES: ${{ matrix.families }}
          STYLES: ${{ matrix.styles }}
        run: JOBS=4 ./build.sh python

      - uses: actions/upload-artifact@v7
        with:
          name: fonts-${{ matrix.name }}
          path: build/*.otf
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the baseline fonts come from an earlier commit

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: System tools (pango-view for the measurements)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pango1.0-tools fontconfig zip

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Gather the fonts
        uses: actions/download-artifact@v8
        with:
          pattern: fonts-*
          path: build
          merge-multiple: true

      - name: Baseline (the fonts committed before this change)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "Baseline: $BASE"
          mkdir -p baseline
          for f in $(git ls-tree --name-only "$BASE" fonts/otf/ | grep -v 'NF-'); do
            git show "$BASE:$f" > "baseline/$(basename "$f")"
          done
          # 1.0.0-beta.3 renamed Jandí Mono to Talha Mono. Fonts committed
          # before that are JandiMono-*.otf; compare them under the new names,
          # or the gate would see only new families and skip them all.
          for f in baseline/JandiMono*.otf; do
            [ -e "$f" ] && mv "$f" "${f/JandiMono/TalhaMono}"
          done
          ls baseline build

      - name: Regression check
        run: python tools/check.py --base baseline --new build --report check-report.md

      - name: Contextual accents and fixed cells
        run: python tools/context_check.py --fonts build --out context-check.json

      - name: Keep the fonts and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talha-mono-${{ github.sha }}
          path: |
            build/*.otf
            check-report.md
            context-check.json
          if-no-files-found: warn

  qa:
    name: qa (${{ matrix.family }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: normal, glob: 'TalhaMono-*.otf' }
          - { family: wide,   glob: 'TalhaMonoWide-*.otf' }
          - { family: text,   glob: 'TalhaMonoText-*.otf' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: fontbakery
        run: pip install -r requirements-qa.txt

      - name: Gather the fonts
        uses: actions/download-artifact@v8
        with:
          pattern: fonts-*
          path: build
          merge-multiple: true

      # Two checks are excluded, each for a known reason:
      # - case_mapping: about 15 African-language lowercase letters (ɓ ɗ ɛ ɔ ƈ
      #   ƙ...) come from Monaspace Radon without their capitals; Radon
      #   fails the same check. Drawing those capitals is on the roadmap.
      # - opentype/monospace: the check reads the glyf table, which CFF
      #   fonts don't have, and crashes (a fontbakery bug, not the font).
      - name: Universal profile
        run: |
          fontbakery check-universal -j --succinct \
            -x case_mapping -x opentype/monospace \
            --ghmarkdown qa-${{ matrix.family }}.md build/${{ matrix.glob }}

      - name: Report
        if: always()
        run: '[ -f qa-${{ matrix.family }}.md ] && cat qa-${{ matrix.family }}.md >> "$GITHUB_STEP_SUMMARY" || true'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, check, qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Gather the fonts
        uses: actions/download-artifact@v8
        with:
          pattern: fonts-*
          path: build
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/merge.py)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION in tools/merge.py" >&2; exit 1
          fi
          # Release notes: this version's section of FONTLOG.txt, up to the
          # next version heading (a pre-release like 1.0.0-beta.1 included).
          awk -v v="$VERSION" '$0 ~ "^"v" \\(" {on=1} on && /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \(/ && $0 !~ "^"v" \\(" {exit} on' FONTLOG.txt > notes.md
          mkdir -p dist/TalhaMono-$VERSION
          cp build/*.otf OFL.txt FONTLOG.txt README.md dist/TalhaMono-$VERSION/
          (cd dist && zip -9 -r "TalhaMono-$VERSION.zip" "TalhaMono-$VERSION")
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease" ;; esac   # betas are pre-releases
          gh release create "$GITHUB_REF_NAME" "dist/TalhaMono-$VERSION.zip" \
            --title "Talha Mono $VERSION" --notes-file notes.md $PRE
